# Seiten-Einstellungen
title: "Jörg Martin – Digitale Entlastung"
description: "KI-Lösungen und Automatisierung für Handwerksbetriebe in Wilhelmshaven & Umgebung."
url: "https://joergmartindigital.de"
permalink: pretty

# Blog-Einstellungen
# Wir nutzen "defaults", damit der Ratgeber-Pfad nur für Blog-Posts gilt
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: /ratgeber/:title/

markdown: kramdown

# Automatisierung (Plugins)
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Ausschlussliste
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .github