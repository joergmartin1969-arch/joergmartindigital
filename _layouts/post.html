<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/style.css?v=3">
  <title>{{ page.title }} – Jörg Martin</title>
</head>
<body>
  <header>
    <div class="wrapper navbar">
      <div class="nav-left">
        <a href="/index.html">
          <img src="/assets/logo.png" alt="Logo" class="nav-logo" width="200" height="80">
        </a>
        <div class="nav-brand">Jörg Martin - Digitale Entlastung</div>
      </div>
    </div>
  </header>

  <main class="wrapper" style="max-width: 800px; margin-top: 100px;">
    <article>
      <div class="hero-kicker">{{ page.date | date: "%d.%m.%Y" }}</div>
      <h1 style="font-size: 2.4rem; line-height: 1.2; margin: 0.5rem 0 2rem;">{{ page.title }}</h1>
      
      <div class="hero-lead" style="color: var(--text); line-height: 1.8;">
        {{ content }}
      </div>
      
      <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">
        <a href="/ratgeber.html" class="btn btn-secondary">← Zurück zur Übersicht</a>
      </div>
    </article>
  </main>

  <footer style="margin-top: 5rem;">
    <div class="footer-inner">
      <div>© Jörg Martin – Digitale Entlastung</div>
    </div>
  </footer>
</body>
</html>
