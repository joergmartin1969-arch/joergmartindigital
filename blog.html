---
layout: default
title: Mein Blog
---
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"> <!-- Deine vorhandene CSS -->
    <title>Blog - Jörg Martin - Digitale Entlastung</title>
</head>
<body>
    <!-- Hier kannst du dein normales Menü/Header einfügen -->
    
    <main>
        <h1>Aktuelle Blog-Beiträge</h1>
        <ul>
          {% for post in site.posts %}
            <li style="margin-bottom: 20px;">
              <strong>{{ post.date | date: "%d.%m.%Y" }}</strong><br>
              <a href="{{ post.url }}" style="font-size: 1.2rem; font-weight: bold;">{{ post.title }}</a>
              <p>{{ post.excerpt | strip_html | truncatewords: 20 }}</p>
            </li>
          {% endfor %}
        </ul>
    </main>
</body>
</html>
